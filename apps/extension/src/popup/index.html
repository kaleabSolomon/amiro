<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amiro Clipper</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="popup">
      <header class="popup-header">
        <p class="kicker">Amiro</p>
        <h1>Web Clipper</h1>
        <p class="muted">Capture the active page into your sync queue.</p>
      </header>

      <section class="connection">
        <p id="connection-state" class="connection-state">Checking session…</p>
        <div class="connection-actions">
          <button id="connect" class="button" type="button">
            Connect Web Session
          </button>
          <button
            id="disconnect"
            class="button button-secondary hidden"
            type="button"
          >
            Disconnect
          </button>
        </div>
      </section>

      <button id="capture" class="button" type="button">
        Save Current Tab
      </button>
      <p id="status" class="status" aria-live="polite"></p>

      <hr class="divider" />

      <section class="meta">
        <p><span>Shortcut</span><strong>Ctrl / ⌘ + Shift + S</strong></p>
        <p><span>Source</span><strong>Chrome</strong></p>
      </section>
    </main>

    <script type="module" src="./index.ts"></script>
  </body>
</html>
